spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties],optional:file:../.env[.properties],optional:file:../.env.local[.properties]

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.auth.jwt-secret=${JWT_SECRET:}
app.auth.jwt-expiration=${JWT_EXPIRATION:PT1H}
app.auth.jwt-issuer=daymate-backend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
